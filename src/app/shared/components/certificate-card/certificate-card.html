<div class="certificate-card"> 
    <div class="card">
        <div class="card-header">
            <img [src]="cardData?.imageUrl" alt="Certificate Image" />
            <h3>{{cardData?.title}}</h3>
        </div>
        <div class="card-body">
            <p>{{cardData?.issuer}}</p>
            <p>{{cardData?.date}}</p>
            <div>
                <button mat-button>View Certificate</button>
            </div>
        </div>
    </div>
</div>
