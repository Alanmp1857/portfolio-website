<mat-grid-list cols="2" rowHeight="2:1">
    <mat-grid-tile>
        <div class="info">
            <label class="role">
                <mat-icon class="role-icon">code</mat-icon>
                Frontend Developer
            </label>
            <h1 class="name">Hi, I'm <span class="name-highlight">Alan Panicker</span></h1>
            <p class="description">I build responsive, scalable and performant web applications.</p>
            <p class="name-highlight">Angular Developer</p>
            <div class="buttons">
                <button class="resume-btn" matFab extended>
                    <mat-icon>download</mat-icon>
                    Download Resume
                </button>
                <button class="contact-btn" matFab extended>
                    <mat-icon>mail</mat-icon>
                    Contact Me
                </button>
            </div>
            <div class="social-icons">
                <a class="icon-label" href="https://github.com/AlanPanicker">
                    <img class="icon-size" src="/assets/github-light.png" alt="GitHub">
                    <span>GitHub</span>
                </a>
                <a class="icon-label" href="https://www.linkedin.com/in/alan-panicker-1b0b1a1b/">
                    <img class="icon-size" src="/assets/linkedin-light.png" alt="LinkedIn">
                    <span>LinkedIn</span>
                </a>
                <a class="icon-label" href="mailto:alan.panicker@example.com">
                    <img class="icon-size" src="/assets/mail-light.png" alt="Email">
                    <span>Email</span>
                </a>
            </div>
        </div>
    </mat-grid-tile>
    <mat-grid-tile>
        <div class="img-container">
            <img class="avatar" src="/assets/AlanPhoto1.jpg" alt="avatar"/>
        </div>
    </mat-grid-tile>
</mat-grid-list>

<div class="stats">
    <div class="each-stat">
        <mat-icon class="big-icon-size">calendar_today</mat-icon>
        <div class="stat-text">
            <span class="years">2.7+</span>
            <span>Years Experience</span>
        </div>
    </div>
    <div class="each-stat">
        <mat-icon class="big-icon-size">rocket_launch</mat-icon>
        <div class="stat-text">
            <span class="years">5+</span>
            <span>Projects Completed</span>
        </div>
    </div>
    <div class="each-stat">
        <mat-icon class="big-icon-size">code</mat-icon>
        <div class="stat-text">
            <span class="years">10+</span>
            <span>Technologies</span>
        </div>
    </div>
    <div class="each-stat">
        <mat-icon>badge</mat-icon>
        <div class="stat-text">
            <span class="years">10+</span>
            <span>Certifications</span>
        </div>
    </div>
</div>
